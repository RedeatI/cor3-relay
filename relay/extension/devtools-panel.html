<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Consolas, monospace;
            background: #0d1c26;
            color: #dcf0f4;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            --col-dir: 22px;
            --col-time: 72px;
            --col-event: 110px;
            --col-action: 100px;
            --col-server: 90px;
            --col-size: 54px;
        }

        /* ===== Toolbar ===== */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            background: #10242f;
            border-bottom: 1px solid #193442;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .toolbar button {
            background: #193442;
            border: 1px solid #355867;
            color: #dcf0f4;
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            white-space: nowrap;
        }
        .toolbar button:hover { background: #355867; }
        .toolbar button.active { background: #244a5a; border-color: #8cdeee; color: #8cdeee; }
        .toolbar button.danger { color: #f38ba8; border-color: #f38ba8; }
        .toolbar button.danger:hover { background: #45172a; }

        .toolbar .separator {
            width: 1px;
            height: 18px;
            background: #355867;
            margin: 0 2px;
        }

        .toolbar input[type="text"] {
            background: #091822;
            border: 1px solid #355867;
            color: #dcf0f4;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            min-width: 180px;
            flex: 1;
        }
        .toolbar input[type="text"]::placeholder { color: #92b2bf; }
        .toolbar input[type="text"]:focus { outline: none; border-color: #8cdeee; }

        .toolbar select {
            background: #091822;
            border: 1px solid #355867;
            color: #dcf0f4;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 11px;
        }

        .toolbar label {
            font-size: 11px;
            color: #accad4;
            display: flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;
        }

        .stats {
            font-size: 10px;
            color: #92b2bf;
            margin-left: auto;
            white-space: nowrap;
        }

        /* ===== Main content ===== */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ===== Message list ===== */
        .message-list-container {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .message-list-header {
            display: grid;
            grid-template-columns: var(--col-dir) var(--col-time) var(--col-event) var(--col-action) var(--col-server) 1fr var(--col-size);
            padding: 3px 8px;
            background: #10242f;
            border-bottom: 1px solid #193442;
            font-size: 10px;
            font-weight: bold;
            color: #accad4;
            flex-shrink: 0;
            position: relative;
            user-select: none;
        }

        .col-header {
            position: relative;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 6px;
        }

        .col-resize {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            cursor: col-resize;
            background: transparent;
            z-index: 2;
        }
        .col-resize:hover, .col-resize.active {
            background: #8cdeee;
        }

        .message-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .msg-row {
            display: grid;
            grid-template-columns: var(--col-dir) var(--col-time) var(--col-event) var(--col-action) var(--col-server) 1fr var(--col-size);
            padding: 2px 8px;
            border-bottom: 1px solid #0d1c26;
            cursor: pointer;
            align-items: center;
            min-height: 22px;
        }
        .msg-row:hover { background: #193442; }
        .msg-row.selected { background: #355867; }

        .msg-dir {
            font-size: 11px;
            font-weight: bold;
            text-align: center;
        }
        .msg-dir.sent { color: #a6e3a1; }
        .msg-dir.received { color: #8cdeee; }

        .msg-time {
            font-size: 10px;
            color: #92b2bf;
            font-family: Consolas, monospace;
        }

        .msg-event {
            font-size: 11px;
            color: #f9e2af;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .msg-action {
            font-size: 10px;
            color: #cba6f7;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .msg-server {
            font-size: 10px;
            color: #94e2d5;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .msg-preview {
            font-size: 10px;
            color: #92b2bf;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .msg-size {
            font-size: 10px;
            color: #244a5a;
            text-align: right;
            font-family: Consolas, monospace;
        }

        /* ===== Detail panel ===== */
        .detail-panel {
            width: 0;
            min-width: 0;
            overflow: hidden;
            border-left: 1px solid #193442;
            background: #091822;
            transition: width 0.15s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .detail-panel.open {
            width: 45%;
            min-width: 200px;
        }
        .detail-panel.resizing {
            transition: none;
        }

        .detail-resize-handle {
            position: absolute;
            left: -3px;
            top: 0;
            bottom: 0;
            width: 6px;
            cursor: col-resize;
            z-index: 10;
            background: transparent;
        }
        .detail-resize-handle:hover,
        .detail-resize-handle.active {
            background: #8cdeee;
        }

        .detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            background: #10242f;
            border-bottom: 1px solid #193442;
            flex-shrink: 0;
            gap: 6px;
        }
        .detail-header span { font-weight: bold; font-size: 11px; }
        .detail-header-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .detail-close {
            background: none;
            border: none;
            color: #92b2bf;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            position: relative;
            z-index: 20;
            pointer-events: auto;
            padding: 4px 6px;
        }
        .detail-close:hover { color: #f38ba8; }

        .detail-format-select {
            background: #193442;
            border: 1px solid #355867;
            color: #dcf0f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            cursor: pointer;
        }
        .detail-format-select:hover { background: #355867; }
        .detail-format-select:focus { outline: none; border-color: #8cdeee; }

        .detail-search-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: #10242f;
            border-bottom: 1px solid #193442;
            flex-shrink: 0;
        }
        .detail-search-bar input {
            flex: 1;
            background: #091822;
            border: 1px solid #355867;
            color: #dcf0f4;
            padding: 3px 6px;
            border-radius: 3px;
            font-size: 11px;
        }
        .detail-search-bar input:focus { outline: none; border-color: #8cdeee; }
        .detail-search-bar button {
            background: #193442;
            border: 1px solid #355867;
            color: #dcf0f4;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 10px;
            cursor: pointer;
            white-space: nowrap;
        }
        .detail-search-bar button:hover { background: #355867; }
        .detail-search-bar .search-count {
            font-size: 10px;
            color: #92b2bf;
            white-space: nowrap;
        }
        .search-highlight { background: #f9e2af33; color: #f9e2af; border-radius: 2px; }
        .search-highlight.current { background: #f9e2af88; }

        /* Tree view */
        .tree-view { font-family: Consolas, monospace; font-size: 11px; line-height: 1.6; }
        .tree-node { }
        .tree-toggle {
            cursor: pointer;
            user-select: none;
            color: #8cdeee;
            display: inline-block;
            width: 14px;
            text-align: center;
        }
        .tree-toggle:hover { color: #dcf0f4; }
        .tree-key { color: #cba6f7; }
        .tree-string { color: #a6e3a1; }
        .tree-number { color: #fab387; }
        .tree-boolean { color: #8cdeee; }
        .tree-null { color: #92b2bf; }
        .tree-bracket { color: #92b2bf; }
        .tree-children { margin-left: 18px; }
        .tree-children.collapsed { display: none; }

        /* Export dropdown */
        .export-dropdown {
            position: relative;
            display: inline-block;
        }
        .export-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #193442;
            border: 1px solid #355867;
            border-radius: 4px;
            z-index: 100;
            min-width: 140px;
            margin-top: 2px;
        }
        .export-menu.open { display: block; }
        .export-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 5px 10px;
            border: none;
            background: none;
            color: #dcf0f4;
            font-size: 11px;
            cursor: pointer;
        }
        .export-menu button:hover { background: #355867; }

        .detail-body {
            flex: 1;
            overflow: auto;
            padding: 8px 10px;
        }
        .detail-body pre {
            font-family: Consolas, 'Courier New', monospace;
            font-size: 11px;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.5;
            color: #dcf0f4;
        }

        .detail-meta {
            font-size: 10px;
            color: #92b2bf;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #193442;
        }
        .detail-meta span { margin-right: 12px; }
        .detail-meta .dir-sent { color: #a6e3a1; font-weight: bold; }
        .detail-meta .dir-received { color: #8cdeee; font-weight: bold; }

        /* ===== Send panel ===== */
        .send-panel {
            border-top: 1px solid #193442;
            background: #10242f;
            padding: 6px 8px;
            flex-shrink: 0;
            display: none;
        }
        .send-panel.open { display: flex; gap: 6px; align-items: flex-start; }

        .send-panel textarea {
            flex: 1;
            background: #091822;
            border: 1px solid #355867;
            color: #dcf0f4;
            padding: 6px 8px;
            border-radius: 4px;
            font-family: Consolas, monospace;
            font-size: 11px;
            resize: vertical;
            min-height: 36px;
            max-height: 120px;
        }
        .send-panel textarea:focus { outline: none; border-color: #8cdeee; }
        .send-panel button {
            background: #193442;
            border: 1px solid #a6e3a1;
            color: #a6e3a1;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            white-space: nowrap;
        }
        .send-panel button:hover { background: #1a3a1a; }

        /* ===== Empty state ===== */
        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: #92b2bf;
            font-size: 13px;
            text-align: center;
            padding: 20px;
        }

        .log-header {
            display: grid;
            grid-template-columns: 90px 60px 1fr;
            padding: 3px 8px;
            background: #10242f;
            border-bottom: 1px solid #193442;
            font-size: 10px;
            font-weight: bold;
            color: #accad4;
            flex-shrink: 0;
        }
        .log-row {
            display: grid;
            grid-template-columns: 90px 60px 1fr;
            padding: 2px 8px;
            border-bottom: 1px solid #0d1c26;
            cursor: pointer;
            align-items: center;
            min-height: 22px;
        }
        .log-row:hover { background: #193442; }
        .log-row.selected { background: #355867; }
        .log-level { font-size: 10px; font-weight: 500; }
        .log-level.log { color: #dcf0f4; }
        .log-level.info { color: #8cdeee; }
        .log-level.success { color: #a6e3a1; }
        .log-level.warn { color: #f9e2af; }
        .log-level.error { color: #f38ba8; }
        .log-message {
            font-size: 11px;
            color: #dcf0f4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: Consolas, monospace;
        }
        .log-header, .log-row { display: none; }
        body.log-mode .log-header, body.log-mode .log-row { display: grid; }
        body.log-mode .message-list-header, body.log-mode .msg-row { display: none; }

        #pageSelector {
            background: #0d1c26; color: #dcf0f4; border: 1px solid #355867; border-radius: 4px;
            padding: 2px 4px; font-size: 11px; cursor: pointer; max-width: 140px;
        }
        #pageSelector:focus { outline: 1px solid #8cdeee; }
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #091822; }
        ::-webkit-scrollbar-thumb { background: #355867; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #244a5a; }

        :root { color-scheme: dark; }
        .toolbar { padding: 6px 8px; border-top: 2px solid #72c3d4; }
        .toolbar input[type="text"] { min-width: min(175px, 45vw); }
        button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 2px solid #8cdeee; outline-offset: 1px;
        }
        .message-list, .detail-body { scrollbar-width: thin; scrollbar-color: #355867 transparent; }
        .empty-state { color: #accad4; line-height: 1.6; }
    </style>
</head>
<body>
<!-- Toolbar -->
<div class="toolbar">
    <button id="btnLive" title="Toggle live auto-refresh">● Live</button>
    <button id="btnRefresh" title="Refresh current page messages">⟳ Refresh</button>
    <div class="separator"></div>
    <label><input type="checkbox" id="filterSent" checked> Sent</label>
    <label><input type="checkbox" id="filterReceived" checked> Received</label>
    <div class="separator"></div>
    <select id="categorySelect" title="Log category">
        <option value="ws-messages">WS Messages</option>
        <option value="auto-jobs">Auto Job Solver</option>
        <option value="auto-valuable">Auto Valuable Seller</option>
        <option value="error-logs">Error Logs</option>
        <option value="page-console">Page Console Logs</option>
        <option value="ext-console">Extension Console Logs</option>
    </select>
    <input type="text" id="searchInput" placeholder="Filter by event or content..." style="min-width:120px;">
    <div class="separator"></div>
    <button id="btnSendToggle" title="Toggle send panel">✉ Send</button>
    <button id="btnClear" class="danger" title="Clear all messages">✕ Clear</button>
    <div class="separator"></div>
    <div class="export-dropdown">
        <button id="btnExport" title="Export filtered messages">⬇ Export</button>
        <div class="export-menu" id="exportMenu">
            <button id="btnExportJson">📄 Export as JSON</button>
            <button id="btnExportMd">📋 Export as MD Table</button>
        </div>
    </div>
    <button id="btnPopout" title="Open external log viewer on new window" style="font-size:13px;padding:3px 7px;">⧉</button>
    <select id="pageSelector" title="Log section"></select>
    <span class="stats" id="statsLabel">(▲0 ▼0)</span>
</div>

<!-- Main content: list + detail -->
<div class="main-content">
    <div class="message-list-container">
        <div class="message-list-header" id="listHeader">
            <span class="col-header" data-col="dir"></span>
            <span class="col-header" data-col="time">Time<span class="col-resize" data-col="time"></span></span>
            <span class="col-header" data-col="event">Event<span class="col-resize" data-col="event"></span></span>
            <span class="col-header" data-col="action">Action<span class="col-resize" data-col="action"></span></span>
            <span class="col-header" data-col="server">Server<span class="col-resize" data-col="server"></span></span>
            <span class="col-header">Preview</span>
            <span class="col-header" style="text-align:right">Size</span>
        </div>
        <div class="log-header" id="logHeader">
            <span>Time</span>
            <span>Level</span>
            <span>Message</span>
        </div>
        <div class="message-list" id="messageList">
            <div class="empty-state" id="emptyState">
                No WebSocket messages yet.<br>Enable "Live" for real-time updates<br>or select a log section to browse history.
            </div>
        </div>
    </div>
    <div class="detail-panel" id="detailPanel">
        <div class="detail-resize-handle" id="detailResizeHandle"></div>
        <div class="detail-header">
            <div class="detail-header-actions" style="gap:6px;">
                <span style="font-weight:bold;font-size:11px;">Message Detail</span>
                <select class="detail-format-select" id="detailFormatSelect" title="Display format">
                    <option value="raw">Raw</option>
                    <option value="pretty" selected>JSON-pretty</option>
                    <option value="tree">Tree View</option>
                </select>
            </div>
            <button class="detail-close" id="detailClose">✕</button>
        </div>
        <div class="detail-search-bar">
            <input type="text" id="detailSearchInput" placeholder="Search in message...">
            <button id="detailSearchBtn" title="Find next (Enter)">🔍</button>
            <span class="search-count" id="detailSearchCount"></span>
        </div>
        <div class="detail-meta" id="detailMeta"></div>
        <div class="detail-body"><pre id="detailBody"></pre></div>
    </div>
</div>

<!-- Send panel -->
<div class="send-panel" id="sendPanel">
    <textarea id="sendInput" placeholder='Enter WS message, e.g. 42["desktop",{"action":"get.options"}]' rows="2"></textarea>
    <button id="btnSend">▶ Send</button>
</div>

<script src="ui-language.js"></script><script src="center-store.js"></script><script src="center-ui.js"></script><script src="devtools-panel.js"></script>
</body>
</html>
